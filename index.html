<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agent Prompt – Inshora</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
      --error: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      min-height: 280px;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: ui-monospace, monospace;
      font-size: 0.8125rem;
      line-height: 1.5;
      resize: vertical;
    }

    textarea.textarea-sm { min-height: 100px; }
    textarea::placeholder { color: var(--muted); }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) {
      background: #3d4d66;
    }
    .status {
      font-size: 0.8125rem;
      margin-top: 0.75rem;
      min-height: 1.25rem;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
    .status.loading { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Voice Agent Prompt</h1>
    <p class="subtitle">Edit system prompt and default instructions stored in MongoDB. The telephony agent builds its instructions from both.</p>

    <div class="card">
      <label for="systemPrompt">System prompt (optional overlay)</label>
      <textarea
        id="systemPrompt"
        class="textarea-sm"
        placeholder="Optional. Prepended before default instructions."
      ></textarea>
    </div>

    <div class="card">
      <label for="defaultInstructions">Default instructions</label>
      <textarea
        id="defaultInstructions"
        placeholder="Main agent instructions: flows, rules, tool usage."
      ></textarea>
      <div class="actions">
        <button type="button" class="btn-secondary" id="loadBtn">Load from MongoDB</button>
        <button type="button" class="btn-primary" id="saveBtn">Save to MongoDB</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const systemPromptEl = document.getElementById('systemPrompt');
    const defaultInstructionsEl = document.getElementById('defaultInstructions');
    const loadBtn = document.getElementById('loadBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusEl = document.getElementById('status');

    const baseUrl = window.location.origin;

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
    }

    async function loadPrompt() {
      setStatus('Loading…', 'loading');
      loadBtn.disabled = true;
      try {
        const res = await fetch(baseUrl + '/api/prompt');
        if (!res.ok) throw new Error(res.status === 503 ? 'MongoDB not configured (MONGODB_URI)' : await res.text());
        const data = await res.json();
        systemPromptEl.value = data.system_prompt || '';
        defaultInstructionsEl.value = data.default_instructions || '';
        setStatus('Loaded.', 'success');
      } catch (e) {
        setStatus('Error: ' + e.message, 'error');
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function savePrompt() {
      setStatus('Saving…', 'loading');
      saveBtn.disabled = true;
      try {
        const res = await fetch(baseUrl + '/api/prompt', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_prompt: systemPromptEl.value,
            default_instructions: defaultInstructionsEl.value
          })
        });
        if (!res.ok) throw new Error(res.status === 503 ? 'MongoDB not configured (MONGODB_URI)' : await res.text());
        setStatus('Saved to MongoDB.', 'success');
      } catch (e) {
        setStatus('Error: ' + e.message, 'error');
      } finally {
        saveBtn.disabled = false;
      }
    }

    loadBtn.addEventListener('click', loadPrompt);
    saveBtn.addEventListener('click', savePrompt);

    loadPrompt();
  </script>
</body>
</html>
